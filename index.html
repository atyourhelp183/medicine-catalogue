@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1621;--card:#16212f;--tx:#e8eef6;--mu:#93a4ba;--ac:#2dd4bf;--bd:#243447}}

html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{padding:28px 16px 12px;max-width:1100px;margin:auto}
h1{margin:0;font-size:1.7rem}header p{margin:4px 0 0;color:var(--mu)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:10px 16px;max-width:1100px;margin:auto;z-index:2}
input{width:100%;padding:12px 14px;font-size:16px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0 2px}
.chip{flex:none;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:6px 12px;border-radius:99px;font-size:13px;cursor:pointer}
.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
main{max-width:1100px;margin:auto;padding:0 16px 30px}
.cnt{color:var(--mu);font-size:13px;margin:8px 0}
h2{font-size:1.05rem;margin:22px 0 8px;color:var(--ac)}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 14px}
.c b{display:block}.c i{font-style:normal;color:var(--mu);font-size:13px;display:block;margin:2px 0 6px}
.s{display:inline-block;background:color-mix(in srgb,var(--ac) 14%,transparent);color:var(--ac);border-radius:6px;padding:2px 8px;font-size:12.5px;margin:2px 0}
footer{max-width:1100px;margin:auto;padding:0 16px 30px;color:var(--mu);font-size:12.5px}
</style></head><body>
